# ~/.hermes/config.yaml for the `hermes` user -- a SKETCH, not a verified file.
#
# The keys below were taken from Hermes Agent's docs source (v0.21.x, Oct 2026)
# through search summaries, not from a running install. Check every key with
# `hermes config` and `hermes doctor` before relying on it; when this file and
# Hermes disagree, Hermes wins.
#
# Hermes here is only the chat front end: it reads your Telegram messages and
# runs the `team` command (skill: ~/.hermes/skills/team-pipeline/SKILL.md). The
# pipeline itself is a script and does not depend on this file being right.
# Its own brain needs a model with >= 64K context; a free Gemini Flash-Lite key
# is enough for "start F12 / status".

model:
  provider: custom
  base_url: https://generativelanguage.googleapis.com/v1beta/openai/   # unverified; or pick Gemini in `hermes model`
  default: <gemini flash-lite id from `team models google`>
  # key: put it in ~/.hermes/.env with `hermes config set ...`, never in this file

fallback_providers:
  - provider: openrouter
    model: <a :free model id from `team models openrouter --free`>

provider_routing:
  data_collection: "deny"        # OpenRouter: skip endpoints that keep or train on prompts

terminal:
  backend: local                 # needs local: the skill runs `sudo -u team /usr/local/bin/team`
                                 # (user hermes has no docker, no sudo beyond that one rule)

approvals:
  mode: smart
  cron_mode: deny
  deny:
    - "rm -rf*"
    - "git push*"
    - "curl*|*sh"

skills:
  write_approval: true           # a model must not rewrite its own skills unattended
memory:
  write_approval: true

# ~/.hermes/.env (mode 600):
#   TELEGRAM_BOT_TOKEN=...
#   TELEGRAM_ALLOWED_USERS=<your numeric Telegram id>   # never GATEWAY_ALLOW_ALL_USERS=true
