# Mutation manifest - see scripts/mutation_check.py
#
# The gate reads the tester's expected.json from beside the project; inside it, `hyperframes init` could not create it.
target: scripts/team/templates/video/acceptance.md
note: The render gate reads videos/<id>.expected.json, never a file inside the project folder.
mutations:
- label: the gate expects the file inside the project folder again
  find: "--expect videos/{{id}}.expected.json"
  replace: "--expect videos/{{id}}/expected.json"
  test: tests.test_team.VideoTeamTests.test_the_tester_output_sits_beside_the_project_so_init_can_scaffold_it
