# Mutation manifest - see scripts/mutation_check.py
#
# setup-vps-team.sh needs root, so CI checks its structure: the subnet check
# that keeps workers inside the egress rules must stay wired in, ahead of the
# first command that changes the box.
target: scripts/team/setup-vps-team.sh
note: The worker-network check in check-worker-net.sh only protects anyone if setup calls it before acting.
mutations:
- label: setup no longer calls the worker-network subnet check
  find: "if command -v docker >/dev/null; then \"${SRC}/check-worker-net.sh\" \"${WORKER_SUBNET}\"; fi\n"
  replace: ''
  test: tests.test_team.LayoutTests.test_setup_checks_the_worker_net_before_any_side_effect
- label: the subnet check runs only after packages are installed
  find: "if command -v docker >/dev/null; then \"${SRC}/check-worker-net.sh\" \"${WORKER_SUBNET}\"; fi\n\necho \"== packages\"\n"
  replace: "echo \"== packages\"\napt-get --version >/dev/null\nif command -v docker >/dev/null; then \"${SRC}/check-worker-net.sh\" \"${WORKER_SUBNET}\"; fi\n"
  test: tests.test_team.LayoutTests.test_setup_checks_the_worker_net_before_any_side_effect
- label: the Codex team's sudoers rule skips the visudo check
  find: "    visudo -cf \"${codex_rule}\" >/dev/null\n"
  replace: ''
  test: tests.test_team.CodexTeamInstallTests.test_hermes_gets_a_separate_visudo_checked_rule_for_the_codex_team
- label: the Codex wrapper is installed without --with-codex
  find: "if [ \"${WITH_CODEX}\" -eq 1 ]; then\n  # The same file under another name"
  replace: "if true; then\n  # The same file under another name"
  test: tests.test_team.CodexTeamInstallTests.test_setup_installs_the_codex_team_only_when_asked
- label: setup tells the operator to log in under the default Codex home again
  find: '  4. CODEX_HOME="\$HOME/.codex-lead" codex login      # as'
  replace: '  4. codex login                                       # as'
  test: tests.test_team.CodexTeamInstallTests.test_every_codex_login_instruction_uses_the_lead_profile
- label: setup no longer installs bubblewrap for the Codex team
  find: 'command -v bwrap >/dev/null || need+=(bubblewrap)'
  replace: 'command -v bwrap >/dev/null || true'
  test: tests.test_team.CodexTeamInstallTests.test_setup_installs_bubblewrap_only_for_the_codex_team
- label: setup no longer asks apt for iptables
  find: "command -v iptables >/dev/null || need+=(iptables)\n"
  replace: ""
  test: tests.test_team.CodexTeamInstallTests.test_setup_cannot_finish_without_iptables
- label: setup carries on when iptables is missing
  find: "command -v iptables >/dev/null || { echo \"iptables is required to limit worker egress and could not be installed\" >&2; exit 1; }\n"
  replace: ""
  test: tests.test_team.CodexTeamInstallTests.test_setup_cannot_finish_without_iptables
- label: "the check leaves an earlier proof in place"
  find: "  rm -f \"\\${ok}\"\n"
  replace: ""
  test: tests.test_team.EgressScriptTests.test_check_removes_the_proof_when_a_rule_is_gone
- label: "the check does not compare the network's subnet"
  find: "  [ \"\\${actual}\" = \"\\${subnet}\" ] ||"
  replace: "  true ||"
  test: tests.test_team.EgressScriptTests.test_check_refuses_a_worker_network_the_rules_do_not_match
- label: "the proof does not name the verified network"
  find: "  printf '%s\\\\n' \"\\${network}\" > \"\\${ok}.tmp\"\n"
  replace: "  printf 'ok\\\\n' > \"\\${ok}.tmp\"\n"
  test: tests.test_team.EgressScriptTests.test_check_writes_the_proof_the_conductor_reads_when_every_rule_is_live
- label: "the proof is unreadable to the team user"
  find: "  chmod 644 \"\\${ok}.tmp\"\n"
  replace: ""
  test: tests.test_team.EgressScriptTests.test_check_writes_the_proof_the_conductor_reads_when_every_rule_is_live
- label: "the unit no longer proves its rules after installing them"
  find: "ExecStartPost=/usr/local/sbin/team-egress --check\n"
  replace: ""
  test: tests.test_team.EgressScriptTests.test_setup_keeps_the_proof_fresh_and_removes_it_when_the_unit_stops
- label: "the proof outlives the unit"
  find: "ExecStop=/bin/rm -f /run/team-egress.ok\n"
  replace: ""
  test: tests.test_team.EgressScriptTests.test_setup_keeps_the_proof_fresh_and_removes_it_when_the_unit_stops
- label: "the proof is checked less often than it can stay valid"
  find: "OnUnitActiveSec=20\n"
  replace: "OnUnitActiveSec=60\n"
  test: tests.test_team.EgressScriptTests.test_setup_keeps_the_proof_fresh_and_removes_it_when_the_unit_stops
- label: "the check timer is never started"
  find: "systemctl enable --now team-egress-check.timer >/dev/null\n"
  replace: ""
  test: tests.test_team.EgressScriptTests.test_setup_keeps_the_proof_fresh_and_removes_it_when_the_unit_stops
- label: "a failed check leaves running containers on the unprotected network"
  find: "    docker ps -q --filter \"network=\\${network}\" | xargs -r docker kill >/dev/null 2>&1 || true\n"
  replace: ""
  test: tests.test_team.EgressScriptTests.test_a_failed_check_stops_the_containers_already_running_on_the_worker_network
- label: "a failed check stops containers on another network"
  find: "docker ps -q --filter \"network=\\${network}\""
  replace: "docker ps -q --filter \"network=bridge\""
  test: tests.test_team.EgressScriptTests.test_a_failed_check_stops_the_containers_already_running_on_the_worker_network
- label: "the check prints nothing for the launch to read"
  find: "  cat \"\\${ok}\"\n"
  replace: ""
  test: tests.test_team.EgressScriptTests.test_check_writes_the_proof_the_conductor_reads_when_every_rule_is_live
- label: "the sudo rule allows any argument"
  find: "team-egress --check\\n' > \"${egress_rule}\""
  replace: "team-egress *\\n' > \"${egress_rule}\""
  test: tests.test_team.EgressScriptTests.test_setup_keeps_the_proof_fresh_and_removes_it_when_the_unit_stops
- label: "the sudo rule is installed without being checked"
  find: "visudo -cf \"${egress_rule}\" >/dev/null\n"
  replace: ""
  test: tests.test_team.EgressScriptTests.test_setup_keeps_the_proof_fresh_and_removes_it_when_the_unit_stops
- label: "the sudo rule is never installed"
  find: "install -o root -g root -m 440 \"${egress_rule}\" /etc/sudoers.d/team-egress-check\n"
  replace: ""
  test: tests.test_team.EgressScriptTests.test_setup_keeps_the_proof_fresh_and_removes_it_when_the_unit_stops
- label: "setup does not install sudo"
  find: "command -v visudo >/dev/null || need+=(sudo)\n"
  replace: ""
  test: tests.test_team.CodexTeamInstallTests.test_setup_requires_sudo_before_its_first_side_effect
- label: "setup goes on without sudo"
  find: "command -v visudo >/dev/null || { echo \"sudo is required (the egress check rule) and could not be installed\" >&2; exit 1; }\n"
  replace: ""
  test: tests.test_team.CodexTeamInstallTests.test_setup_requires_sudo_before_its_first_side_effect
- label: "the check does not compare the first DOCKER-USER rules"
  find: "[ \"\\$(have_user)\" = \"\\$(want_user)\" ] ||"
  replace: "true ||"
  test: tests.test_team.EgressScriptTests.test_check_refuses_rules_that_a_competing_rule_precedes
- label: "the check does not compare the first INPUT rule"
  find: "[ \"\\$(first_input)\" = \"-A INPUT -s \\${subnet} -j DROP\" ] ||"
  replace: "true ||"
  test: tests.test_team.EgressScriptTests.test_check_refuses_rules_that_a_competing_rule_precedes
- label: "the first INPUT rule is read from the rules that match our subnet"
  find: "awk '/^-A INPUT /{ print; exit }'"
  replace: "awk '/^-A INPUT -s/{ print; exit }'"
  test: tests.test_team.EgressScriptTests.test_check_refuses_rules_that_a_competing_rule_precedes
- label: "maintain does not put the rules back"
  find: "\"\\$0\" --check \"\\${2:-}\" >/dev/null 2>&1 || { \"\\$0\" && \"\\$0\" --check \"\\${2:-}\" >/dev/null; }\n"
  replace: "\"\\$0\" --check \"\\${2:-}\" >/dev/null 2>&1 || true\n"
  test: tests.test_team.EgressScriptTests.test_maintain_restores_flushed_or_outranked_rules_and_does_nothing_otherwise
- label: "the rules are rebuilt on every run"
  find: "if [ -n \"\\$(problem)\" ]; then\n"
  replace: "if true; then\n"
  test: tests.test_team.EgressScriptTests.test_applying_the_rules_puts_them_first_and_leaves_a_correct_set_alone
- label: "old DOCKER-USER copies are left behind when the rules are rebuilt"
  find: "    while iptables -C DOCKER-USER -s \"\\${subnet}\" -d \"\\${dest}\" -j DROP 2>/dev/null; do\n      iptables -D DOCKER-USER -s \"\\${subnet}\" -d \"\\${dest}\" -j DROP\n    done\n"
  replace: ""
  test: tests.test_team.EgressScriptTests.test_applying_the_rules_puts_them_first_and_leaves_a_correct_set_alone
- label: "an old INPUT copy is left behind when the rules are rebuilt"
  find: "  while iptables -C INPUT -s \"\\${subnet}\" -j DROP 2>/dev/null; do iptables -D INPUT -s \"\\${subnet}\" -j DROP; done\n"
  replace: ""
  test: tests.test_team.EgressScriptTests.test_applying_the_rules_puts_them_first_and_leaves_a_correct_set_alone
- label: "the timer only checks and never repairs"
  find: "ExecStart=/usr/local/sbin/team-egress --maintain\n"
  replace: "ExecStart=/usr/local/sbin/team-egress --check\n"
  test: tests.test_team.EgressScriptTests.test_setup_keeps_the_proof_fresh_and_removes_it_when_the_unit_stops
- label: "the Claude team's home is group-writable again"
  find: "install -d -o team -g team -m 2750 \"${TEAM_HOME}\"\n"
  replace: "install -d -o team -g team -m 2770 \"${TEAM_HOME}\"\n"
  test: tests.test_team.CodexTeamInstallTests.test_team_homes_are_not_writable_by_the_admins_group
- label: "the Codex team's home is group-writable again"
  find: "install -d -o team -g team -m 2750 \"${CODEX_HOME}\"\n"
  replace: "install -d -o team -g team -m 2770 \"${CODEX_HOME}\"\n"
  test: tests.test_team.CodexTeamInstallTests.test_team_homes_are_not_writable_by_the_admins_group
- label: "the video team's home is group-writable again"
  find: "install -d -o team -g team -m 2750 \"${VIDEO_HOME}\"\n"
  replace: "install -d -o team -g team -m 2770 \"${VIDEO_HOME}\"\n"
  test: tests.test_team.CodexTeamInstallTests.test_team_homes_are_not_writable_by_the_admins_group
- label: "the work directory stops being group-writable"
  find: "install -d -o team -g team -m 2770 \"${TEAM_HOME}/work\"\n"
  replace: "install -d -o team -g team -m 2750 \"${TEAM_HOME}/work\"\n"
  test: tests.test_team.CodexTeamInstallTests.test_team_homes_are_not_writable_by_the_admins_group
- label: "the egress check no longer looks at FORWARD"
  find: '  [ "\$(first_forward)" = "-A FORWARD -j DOCKER-USER" ] || {'
  replace: '  [ "x" = "x" ] || {'
  test: tests.test_team.EgressScriptTests.test_check_refuses_a_forward_chain_that_never_reaches_the_docker_user_chain
- label: "a jump into DOCKER-USER anywhere in FORWARD satisfies the egress check"
  find: "first_forward() { iptables -S FORWARD | awk '/^-A FORWARD /{ print; exit }'; }"
  replace: "first_forward() { iptables -S FORWARD | awk '/^-A FORWARD -j DOCKER-USER$/{ print; exit }'; }"
  test: tests.test_team.EgressScriptTests.test_check_refuses_a_forward_chain_that_never_reaches_the_docker_user_chain
- label: "applying the egress rules does not put the FORWARD jump back"
  find: "  iptables -I FORWARD -j DOCKER-USER\n"
  replace: ''
  test: tests.test_team.EgressScriptTests.test_maintain_restores_flushed_or_outranked_rules_and_does_nothing_otherwise
- label: "setup does not check the seals of the main team home"
  find: "reset_seals \"${TEAM_HOME}\" team team\n"
  replace: ''
  test: tests.test_team.CodexTeamInstallTests.test_setup_checks_the_seals_of_every_home_it_creates_after_creating_it
- label: "setup does not check the seals of the Codex team home"
  find: "  reset_seals \"${CODEX_HOME}\" team team\n"
  replace: ''
  test: tests.test_team.CodexTeamInstallTests.test_setup_checks_the_seals_of_every_home_it_creates_after_creating_it
- label: "setup does not check the seals of the video team home"
  find: "  reset_seals \"${VIDEO_HOME}\" team team\n"
  replace: ''
  test: tests.test_team.CodexTeamInstallTests.test_setup_checks_the_seals_of_every_home_it_creates_after_creating_it
- label: "setup keeps a seals directory whatever its owner and mode"
  find: "[ \"$(stat -c '%U:%G:%a' \"${seals}\")\" = \"${owner}:${group}:750\" ]"
  replace: "[ -n \"$(stat -c '%U:%G:%a' \"${seals}\")\" ]"
  test: tests.test_team.CodexTeamInstallTests.test_setup_removes_a_seals_entry_that_is_not_the_directory_the_conductor_makes
- label: "setup keeps a seals directory with anything but files in it"
  find: "     && [ -z \"$(find \"${seals}\" -mindepth 1 ! -type f -print -quit)\" ]; then"
  replace: "     && true; then"
  test: tests.test_team.CodexTeamInstallTests.test_setup_removes_a_seals_entry_that_is_not_the_directory_the_conductor_makes
- label: "setup removes a healthy seals directory on every run"
  find: "    return 0\n  fi\n  echo \"removing ${seals}"
  replace: "  fi\n  echo \"removing ${seals}"
  test: tests.test_team.CodexTeamInstallTests.test_setup_removes_a_seals_entry_that_is_not_the_directory_the_conductor_makes
