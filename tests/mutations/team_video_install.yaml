# Mutation manifest - see scripts/mutation_check.py
#
# The wrapper picks the team from its installed name. The video team must get its own home, its own lead
# and the shared pipeline lock (one Chrome render at a time on a VPS that also runs CI).
target: scripts/team/team-wrapper.sh
note: team-video selects the video lead and shares the first team's pipeline lock.
mutations:
- label: the video team stops sharing the first team's pipeline lock
  find: " TEAM_LEAD=video TEAM_LOCK=/srv/team/.run.lock ;;\n"
  replace: " TEAM_LEAD=video ;;\n"
  test: tests.test_team.CodexTeamInstallTests.test_the_video_name_selects_the_video_team
- label: the video team is run as the Claude team
  find: "export TEAM_HOME=/srv/team-video TEAM_LEAD=video "
  replace: "export TEAM_HOME=/srv/team-video TEAM_LEAD=claude "
  test: tests.test_team.CodexTeamInstallTests.test_the_video_name_selects_the_video_team
