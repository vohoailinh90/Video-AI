# Mutation manifest - see scripts/mutation_check.py
#
# Hermes is driven by a free model reading chat messages. Its only door to the
# pipeline is this wrapper, so the wrapper's limits must be guarded by tests.
target: scripts/team/team-wrapper.sh
note: What user hermes may do through `sudo -u team /usr/local/bin/team`.
mutations:
- label: hermes may use --force (push without an audit, extra audit rounds)
  find: "      --force*) echo \"team: --force is for the admin only\" >&2; exit 1 ;;\n"
  replace: ''
  test: tests.test_team.LayoutTests.test_hermes_cannot_push_or_force
- label: hermes may run any subcommand
  find: "    *) echo \"team: hermes may only use status, check-spec, run and doctor\" >&2; exit 1 ;;\n"
  replace: ''
  test: tests.test_team.LayoutTests.test_hermes_cannot_push_or_force
- label: the Codex team stops sharing the first team's pipeline lock
  find: " TEAM_LEAD=codex TEAM_LOCK=/srv/team/.run.lock ;;\n"
  replace: " TEAM_LEAD=codex ;;\n"
  test: tests.test_team.CodexTeamInstallTests.test_each_name_selects_its_team
- label: the caller's TEAM_LOCK survives into the Claude team
  find: "; unset TEAM_LOCK; NAME=team ;;"
  replace: "; NAME=team ;;"
  test: tests.test_team.CodexTeamInstallTests.test_the_callers_environment_cannot_pick_the_team
- label: an unknown wrapper name falls through to a default team
  find: "  *) echo \"team: installed under an unknown name '${NAME}'\" >&2; exit 1 ;;\n"
  replace: "  *) ;;\n"
  test: tests.test_team.CodexTeamInstallTests.test_an_unknown_name_is_refused
- label: writes by the Codex team re-enter through the first team's command
  find: 'exec sudo -u team -- "/usr/local/bin/${NAME}" "$@"'
  replace: 'exec sudo -u team -- /usr/local/bin/team "$@"'
  test: tests.test_team.CodexTeamInstallTests.test_writes_re_enter_through_the_same_name
