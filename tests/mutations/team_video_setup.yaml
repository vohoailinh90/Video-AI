# Mutation manifest - see scripts/mutation_check.py
#
# --with-video must start the video team from its own team.env (image, memory, /dev/shm), and give hermes a
# sudoers rule of its own so removing one team never touches another.
target: scripts/team/setup-vps-team.sh
note: The video team's config comes from its own example, and the image is built from Dockerfile.video.
mutations:
- label: the video team starts from the code team's team.env
  find: 'if [ "${home}" = "${VIDEO_HOME}" ] && [ "${name}" = team.env ]; then example="${PREFIX}/team.env.video.example"; fi'
  replace: ':'
  test: tests.test_team.CodexTeamInstallTests.test_setup_installs_the_video_team_only_when_asked
- label: the video image is built from the code team's Dockerfile
  find: 'docker build -q -t team-video-worker:latest -f "${PREFIX}/Dockerfile.video" "${PREFIX}"'
  replace: 'docker build -q -t team-video-worker:latest "${PREFIX}"'
  test: tests.test_team.CodexTeamInstallTests.test_setup_installs_the_video_team_only_when_asked
