# Mutation manifest - see scripts/mutation_check.py
#
# video_gates.py is the only judge of a rendered video's sound. A gate that
# passes a silent render, a clipped mix or a dead tail ships a video nobody can
# hear, and the model audit never listens. Each entry removes one check.
target: scripts/team/video/video_gates.py
note: A render with no audio, silence, clipping, a dead tail or the wrong length must be rejected.
mutations:
- label: a render with no audio stream passes
  find: 'check(audio, "audio stream", "present" if audio else "missing: the render is silent")'
  replace: 'check(True, "audio stream", "present" if audio else "missing: the render is silent")'
  test: tests.test_video_gates.EvaluateTests.test_a_render_without_an_audio_stream_fails
- label: an unmeasured loudness passes
  find: 'check(lufs is not None and low <= lufs <= high, "loudness",'
  replace: 'check(lufs is None or low <= lufs <= high, "loudness",'
  test: tests.test_video_gates.EvaluateTests.test_an_unmeasured_loudness_fails_instead_of_passing_silently
- label: a silent track passes the loudness window
  find: 'check(lufs is not None and low <= lufs <= high, "loudness",'
  replace: 'check(True, "loudness",'
  test: tests.test_video_gates.EvaluateTests.test_a_silent_track_fails_on_loudness
- label: a clipped mix passes
  find: 'check(peak is not None and peak <= ceiling, "true peak",'
  replace: 'check(True, "true peak",'
  test: tests.test_video_gates.EvaluateTests.test_clipping_fails_on_true_peak
- label: a long silence passes
  find: 'check(longest <= limit, "silence gap",'
  replace: 'check(True, "silence gap",'
  test: tests.test_video_gates.EvaluateTests.test_a_long_silence_fails
- label: a dead tail is not counted as silence
  find: "    if start is not None:\n        trailing = audio_end - start + lead(start)\n"
  replace: "    if False:\n        trailing = audio_end - start + lead(start)\n"
  test: tests.test_video_gates.ParserTests.test_a_silence_that_never_ends_runs_to_the_end_of_the_audio
- label: a short audio track passes
  find: 'check(coverage >= opts.get("min_coverage", 0.9), "audio coverage",'
  replace: 'check(True, "audio coverage",'
  test: tests.test_video_gates.EvaluateTests.test_a_short_audio_track_fails_on_coverage
- label: the wrong length passes
  find: 'check(abs(length - expected["duration_s"]) <= tolerance, "duration",'
  replace: 'check(True, "duration",'
  test: tests.test_video_gates.EvaluateTests.test_a_wrong_length_fails_on_duration
- label: a mistyped key silently disables a check
  find: "    if unknown:\n        raise SystemExit"
  replace: "    if False:\n        raise SystemExit"
  test: tests.test_video_gates.ExpectedFileTests.test_a_typo_in_a_key_is_an_error_not_a_disabled_check
- label: the audio check ignores an optional-audio declaration
  find: 'if not opts.get("required", True):'
  replace: 'if False:'
  test: tests.test_video_gates.EvaluateTests.test_audio_can_be_declared_optional
- label: a string passes as a number in expected.json
  find: "    if wrong:\n        raise SystemExit("
  replace: "    if False:\n        raise SystemExit("
  test: tests.test_video_gates.ExpectedFileTests.test_a_string_where_a_number_belongs_is_a_clean_error
- label: a boolean passes as a number
  find: "    return isinstance(value, (int, float)) and not isinstance(value, bool)"
  replace: "    return isinstance(value, (int, float))"
  test: tests.test_video_gates.ExpectedFileTests.test_a_string_where_a_number_belongs_is_a_clean_error
- label: an unreadable frame rate crashes the gate
  find: "    except (ValueError, ZeroDivisionError):\n        return 0.0\n"
  replace: "    except KeyError:\n        return 0.0\n"
  test: tests.test_video_gates.FrameRateTests.test_fractions_whole_numbers_and_unknowns
- label: the silent tail after the audio stream is not counted
  find: "    longest = max(max(gaps, default=0.0), trailing + tail, audio_start)\n"
  replace: "    longest = max(max(gaps, default=0.0), trailing, audio_start)\n"
  test: tests.test_video_gates.EvaluateTests.test_a_silent_tail_after_the_audio_stream_ends_counts_as_silence
- label: "a picture that stops before the sound passes"
  find: "abs(picture_length - expected[\"duration_s\"]) <= tolerance, \"video duration\""
  replace: "True, \"video duration\""
  test: tests.test_video_gates.EvaluateTests.test_a_picture_that_stops_before_the_sound_fails_on_video_duration
- label: "an unmeasured picture duration passes"
  find: "check(picture_length is not None and abs("
  replace: "check(picture_length is None or abs("
  test: tests.test_video_gates.EvaluateTests.test_a_video_stream_that_reports_no_duration_is_unmeasured_not_passed
- label: "N/A is read as a picture duration of zero"
  find: "if picture not in (None, \"N/A\") else None"
  replace: "if picture is not None else None"
  test: tests.test_video_gates.EvaluateTests.test_a_video_stream_that_reports_no_duration_is_unmeasured_not_passed
- label: "the trailing silence and the missing tail are compared instead of added"
  find: "    longest = max(max(gaps, default=0.0), trailing + tail, audio_start)\n"
  replace: "    longest = max(max(gaps, default=0.0), trailing, tail, audio_start)\n"
  test: tests.test_video_gates.EvaluateTests.test_trailing_silence_and_the_missing_audio_tail_are_one_silence
- label: "the missing tail is added to a silence inside the audio"
  find: "    longest = max(max(gaps, default=0.0), trailing + tail, audio_start)\n"
  replace: "    longest = max(gaps, default=0.0) + tail + audio_start\n"
  test: tests.test_video_gates.EvaluateTests.test_the_tail_does_not_add_to_a_silence_inside_the_audio
- label: "a silence closed at the end of the stream is filed with the inner ones"
  find: "            if end >= audio_end - EOF_EDGE_S:\n"
  replace: "            if False:\n"
  test: tests.test_video_gates.ParserTests.test_a_silence_ffmpeg_closes_at_the_end_of_the_stream_is_the_trailing_one
- label: "a silence that ends just short of the stream's end is not trailing"
  find: "            if end >= audio_end - EOF_EDGE_S:\n"
  replace: "            if end >= audio_end:\n"
  test: tests.test_video_gates.ParserTests.test_a_silence_ffmpeg_closes_at_the_end_of_the_stream_is_the_trailing_one
- label: "only silences as long as the limit are reported, so a short trailing one is invisible"
  find: "SILENCE_MIN_S = 0.2"
  replace: "SILENCE_MIN_S = 4.0"
  test: tests.test_video_gates.RenderedClipTests.test_silence_at_the_end_of_a_short_audio_stream_adds_to_the_missing_tail
- label: "a late start is dropped from the longest silence"
  find: "    longest = max(max(gaps, default=0.0), trailing + tail, audio_start)\n"
  replace: "    longest = max(max(gaps, default=0.0), trailing + tail)\n"
  test: tests.test_video_gates.EvaluateTests.test_a_late_start_alone_counts_as_silence_before_the_sound
- label: "a late start and an early end are added together"
  find: "    longest = max(max(gaps, default=0.0), trailing + tail, audio_start)\n"
  replace: "    longest = max(max(gaps, default=0.0), trailing + tail + audio_start)\n"
  test: tests.test_video_gates.EvaluateTests.test_a_late_start_and_an_early_end_are_two_silences_not_one
- label: "the missing tail is measured from the start of the audio stream instead of its end"
  find: "    tail = max(0.0, length - (audio_start + audio_length))\n"
  replace: "    tail = max(0.0, length - audio_length)\n"
  test: tests.test_video_gates.EvaluateTests.test_a_late_start_and_an_early_end_are_two_silences_not_one
- label: "the container's own start time is not subtracted from the stream's"
  find: "seconds(audio.get(\"start_time\")) - seconds(container.get(\"start_time\"))"
  replace: "seconds(audio.get(\"start_time\"))"
  test: tests.test_video_gates.EvaluateTests.test_the_late_start_is_measured_from_the_containers_first_timestamp
- label: "the parser is not told where the audio starts"
  find: "        gaps, trailing = parse_silences(silence, length, start)\n"
  replace: "        gaps, trailing = parse_silences(silence, length)\n"
  test: tests.test_video_gates.RenderedClipTests.test_silence_before_a_late_stream_adds_to_a_silence_that_starts_with_it
- label: "a silence that starts with a late stream does not continue the stretch before it"
  find: "        return audio_start if begin <= audio_start + EOF_EDGE_S else 0.0\n"
  replace: "        return 0.0\n"
  test: tests.test_video_gates.ParserTests.test_silencedetect_times_are_on_the_container_timeline_when_the_audio_starts_late
- label: "a silent late stream forgets the stretch before it"
  find: "                trailing = audio_end - start + lead(start)\n            else:"
  replace: "                trailing = audio_end - start\n            else:"
  test: tests.test_video_gates.ParserTests.test_audio_that_is_silent_throughout_and_starts_late_is_one_silence_with_the_lead
- label: "audible sound just before the end of the stream is read as part of the trailing silence"
  find: "EOF_EDGE_S = 0.1  #"
  replace: "EOF_EDGE_S = 0.25  #"
  test: tests.test_video_gates.ParserTests.test_a_silence_that_stops_short_of_the_end_of_the_stream_is_not_the_trailing_one
