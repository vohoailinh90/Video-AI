# Mutation manifest - see scripts/mutation_check.py
#
# The architect decides where the supplied files live; the free builders only follow the spec.
target: scripts/team/prompts/video/spec.md
note: The architect stages supplied audio in videos/<id>.inputs/ and keeps the builder out of it.
mutations:
- label: the architect is no longer told where supplied audio is staged
  find: "they are staged in `videos/{{id}}.inputs/`, beside the project folder"
  replace: "they are in the project folder"
  test: tests.test_team.VideoTeamTests.test_supplied_audio_is_staged_beside_the_project_not_inside_it
