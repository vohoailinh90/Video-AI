# Mutation manifest - see scripts/mutation_check.py
#
# The egress rules match the worker subnet by address; a team-net with any
# other subnet would leave workers unrestricted while setup reported success.
target: scripts/team/check-worker-net.sh
note: setup-vps-team.sh refuses a pre-existing team-net whose subnet the egress rules do not cover.
mutations:
- label: any existing team-net is accepted
  find: 'if [ "${actual}" != "${expected}" ]; then'
  replace: 'if false; then'
  test: tests.test_team.LayoutTests.test_a_worker_net_with_another_subnet_is_refused
