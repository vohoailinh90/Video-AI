# Mutation manifest - see scripts/mutation_check.py
#
# The audit reads a pack of worker-written text, so the lead is started by a
# launcher that confines it. Each line below widens the lead's reach without any
# other test noticing; the launcher test runs the script with a fake codex.
target: scripts/team/codex-lead.sh
note: The launcher must keep every confinement the audit relies on.
mutations:
- label: the lead runs unconfined
  find: "exec codex --sandbox workspace-write --ask-for-approval never"
  replace: "exec codex --sandbox danger-full-access --ask-for-approval never"
  test: tests.test_team.CodexTeamInstallTests.test_the_launcher_confines_the_lead
- label: the lead may ask the operator to approve leaving the sandbox
  find: "--ask-for-approval never"
  replace: "--ask-for-approval on-request"
  test: tests.test_team.CodexTeamInstallTests.test_the_launcher_confines_the_lead
- label: the lead gets the network back
  find: "  --config sandbox_workspace_write.network_access=false"
  replace: "  --config sandbox_workspace_write.network_access=true"
  test: tests.test_team.CodexTeamInstallTests.test_the_launcher_confines_the_lead
- label: configured extra writable roots stay open
  find: "  --config 'sandbox_workspace_write.writable_roots=[]'"
  replace: "  --config 'sandbox_workspace_write.writable_roots=[\"/tmp\"]'"
  test: tests.test_team.CodexTeamInstallTests.test_the_launcher_confines_the_lead
- label: the lead may write the operator's $TMPDIR again
  find: "  --config sandbox_workspace_write.exclude_tmpdir_env_var=true"
  replace: "  --config sandbox_workspace_write.exclude_tmpdir_env_var=false"
  test: tests.test_team.CodexTeamInstallTests.test_the_launcher_confines_the_lead
- label: the lead may write /tmp again
  find: "  --config sandbox_workspace_write.exclude_slash_tmp=true"
  replace: "  --config sandbox_workspace_write.exclude_slash_tmp=false"
  test: tests.test_team.CodexTeamInstallTests.test_the_launcher_confines_the_lead
- label: live web search is allowed again
  find: "  --config 'web_search=\"disabled\"'"
  replace: "  --config 'web_search=\"live\"'"
  test: tests.test_team.CodexTeamInstallTests.test_the_launcher_confines_the_lead
- label: the lead loads the operator's own Codex config (MCP servers, plugins) again
  find: 'export CODEX_HOME="$HOME/.codex-lead"'
  replace: 'export CODEX_HOME="$HOME/.codex"'
  test: tests.test_team.CodexTeamInstallTests.test_the_launcher_confines_the_lead
- label: the lead's profile config is appended to instead of rewritten each run
  find: "web_search = \"disabled\"\\n' > "
  replace: "web_search = \"disabled\"\\n' >> "
  test: tests.test_team.CodexTeamInstallTests.test_the_launcher_confines_the_lead
- label: the scratch directory is no longer the lead's TMPDIR
  find: 'export TMPDIR="${scratch}" TMP="${scratch}" TEMP="${scratch}"'
  replace: 'export TMP="${scratch}" TEMP="${scratch}"'
  test: tests.test_team.CodexTeamInstallTests.test_the_launcher_confines_the_lead
- label: the launcher no longer requires the feature's request.md and out/
  find: "    || [ ! -f request.md ] || [ ! -d out ]; then"
  replace: "    || false; then"
  test: tests.test_team.CodexTeamInstallTests.test_the_launcher_refuses_places_and_users_it_cannot_confine
- label: the launcher runs as the team or hermes user
  find: '  team|hermes) echo "codex-lead: run it as your own login, not as $(id -un)" >&2; exit 1 ;;'
  replace: "  team|hermes) ;;"
  test: tests.test_team.CodexTeamInstallTests.test_the_launcher_refuses_places_and_users_it_cannot_confine
- label: the launcher forwards any option, so --search or --add-dir undo the confinement
  find: "    *) echo \"codex-lead: only --model is accepted, not '$1' (it could undo the confinement)\" >&2; exit 1 ;;"
  replace: '    *) extra+=("$1"); shift ;;'
  test: tests.test_team.CodexTeamInstallTests.test_the_launcher_accepts_only_a_model_option
- label: a model name that is really an option is accepted
  find: 'if [ $# -lt 2 ] || [[ "$2" == -* ]]; then'
  replace: 'if [ $# -lt 2 ]; then'
  test: tests.test_team.CodexTeamInstallTests.test_the_launcher_accepts_only_a_model_option
- label: the lead's shell commands inherit the operator's whole environment again
  find: "  --config 'shell_environment_policy.inherit=\"core\"'"
  replace: "  --config 'shell_environment_policy.inherit=\"all\"'"
  test: tests.test_team.CodexTeamInstallTests.test_the_launcher_confines_the_lead
- label: the lead's shell commands may start a login shell that re-reads the operator's profile
  find: "  --config allow_login_shell=false"
  replace: "  --config allow_login_shell=true"
  test: tests.test_team.CodexTeamInstallTests.test_the_launcher_confines_the_lead
- label: any directory with request.md and out/ is accepted, including the other team's
  find: '  "${root}"/*) id="${here#"${root}"/}" ;;'
  replace: '  *) id="x" ;;'
  test: tests.test_team.CodexTeamInstallTests.test_the_launcher_refuses_places_and_users_it_cannot_confine
- label: symlinks are not resolved before the directory is checked
  find: 'here="$(pwd -P)"'
  replace: 'here="$PWD"'
  test: tests.test_team.CodexTeamInstallTests.test_the_launcher_refuses_places_and_users_it_cannot_confine
- label: the launcher starts Codex without the sandbox runtime installed
  find: "if ! command -v bwrap >/dev/null 2>&1; then"
  replace: "if false; then"
  test: tests.test_team.CodexTeamInstallTests.test_the_launcher_needs_bubblewrap
- label: the lead inherits the operator's umask, so the spec and verdict are unreadable by the pipeline user
  find: "umask 007\n"
  replace: ""
  test: tests.test_team.CodexTeamInstallTests.test_files_the_lead_writes_are_readable_by_the_pipeline_user
